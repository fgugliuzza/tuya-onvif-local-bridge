[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "tuya-onvif-local-bridge"
version = "0.1.15"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Francesco Gugliuzza" }]
dependencies = ["aiohttp>=3.9,<4", "lxml>=5,<7", "tinytuya>=1.16,<2"]
[project.urls]
Homepage = "https://gugliuzza.cloud"
Source = "https://github.com/fgugliuzza/tuya-onvif-local-bridge"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "xmlschema>=3,<5"]
[project.scripts]
tuya-onvif-local-bridge = "tuya_onvif_local_bridge.app:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
